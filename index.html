  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

splay: none !important; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div ref=\"{{ rootRef }}\" style=\"position: relative; min-height: 100vh; font-family: 'Space Grotesk', system-ui, sans-serif; overflow: clip;\">\n\n  <div style=\"position: fixed; inset: 0; z-index: 0; background: var(--bg, #f6f7fb); transition: background 0.3s ease; pointer-events: none;\"><\u002Fdiv>\n\n  <sc-if value=\"{{ bgTexture }}\" hint-placeholder-val=\"{{ true }}\">\n    {{ starField }}\n  <\u002Fsc-if>\n\n  <!-- NAV -->\n  <nav style=\"position: fixed; top: 0; left: 0; right: 0; z-index: 50; backdrop-filter: blur(14px); background: var(--nav-bg, rgba(246,247,251,0.78)); border-bottom: 1px solid var(--border-soft, rgba(20,22,31,0.07));\">\n    <div style=\"max-width: 1140px; margin: 0 auto; padding: 13px 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px;\">\n      <a href=\"#top\" style=\"text-decoration: none; color: var(--text, #14161f); font-weight: 600; font-size: 15.5px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; flex: none;\">\n        <span style=\"width: 8px; height: 8px; border-radius: 50%; background: var(--accent, #6b4bd6); box-shadow: var(--logo-glow, 0 0 10px rgba(107,75,214,0.45));\"><\u002Fspan>\n        Mohamad Rizk\n      <\u002Fa>\n\n      <div style=\"display: flex; align-items: center; gap: 9px; flex: none;\">\n        <a href=\"mailto:moerizz@umich.edu\" aria-label=\"Email\" style=\"width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 11px; border: 1px solid var(--border-strong, rgba(20,22,31,0.14)); background: var(--surface, #ffffff); color: var(--text, #14161f); text-decoration: none; transition: border-color 0.18s, box-shadow 0.18s, color 0.18s, transform 0.18s;\" style-hover=\"border-color: var(--accent, #6b4bd6); color: var(--accent, #6b4bd6); box-shadow: var(--icon-glow, 0 6px 18px rgba(107,75,214,0.26)); transform: translateY(-1px);\">\n          <sv ap: 12px; margin-bottom: 32px;\">\n      <span style=\"width: 3px; height: 3px; border-radius: 50%; background: var(--accent-dot, rgba(107,75,214,0.6)); flex: none;\"><\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: var(--border, rgba(20,22,31,0.1));\"><\u002Fspan>\n      <span style=\"width: 3px; height: 3px; border-radius: 50%; background: var(--accent-dot, rgba(107,75,214,0.6)); flex: none;\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"sec-head\">Certifications<\u002Fh2>\n    <p style=\"margin: 0 0 36px; font-size: 15.5px; font-weight: 400; color: var(--text-muted, #6b717c); letter-spacing: -0.005em;\">How I have been building the foundation<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;\">\n      <sc-for list=\"{{ certs }}\" as=\"cert\" hint-placeholder-count=\"4\">\n        <div data-reveal=\"1\" style=\"opacity: 0; transform: translateY(22px); transition: opacity 0.65s cubic-bezier(0.22,1,0.36,1), transform 0.65s cubic-bezier(0.22,1,0.36,1);\">\n        <div style=\"position: relative; height: 100%; background: var(--surface, #ffffff); border: 1px solid var(--border, rgba(20,22,31,0.1)); border-radius: 14px; padding: 24px 26px; transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s;\" style-hover=\"border-color: var(--card-hover-border, rgba(107,75,214,0.5)); box-shadow: var(--cert-hover-shadow, 0 12px 30px rgba(107,75,214,0.12)); transform: translateY(-3px);\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px;\">\n            <span style=\"font-size: 12.5px; font-weight: 500; letter-spacing: 0.01em; color: var(--text-faint, #7d828d);\">{{ cert.issuer }}<\u002Fspan>\n            <span style=\"font-size: 12px; color: var(--accent-dot, rgba(107,75,214,0.7));\">{{ cert.date }}<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin: 0; font-size: 17.5px; font-weight: 600; letter-spac : \"Engineering Probability and Statistics\", cat: \"Data / AI\",\n      tags: [\"Statistics\", \"Probability\", \"Data Analysis\", \"Risk\", \"Decision Making\"],\n      bullets: [\n        \"Studied probability, distributions, statistical reasoning, and data-based decision making.\",\n        \"Built a stronger foundation for interpreting uncertainty, risk, and patterns in data.\",\n        \"Connected statistics concepts to cybersecurity alert scoring, phishing risk levels, and threat analysis.\"\n      ] },\n    { code: \"EECS 493\", name: \"Human-Computer Interaction\", cat: \"Professional\",\n      tags: [\"HCI\", \"User Experience\", \"Interface Design\", \"Usability\", \"Product Thinking\"],\n      bullets: [\n        \"Studied how users interact with software and how design choices affect usability.\",\n        \"Learned about interface design, user feedback, accessibility, and reducing friction in applications.\",\n        \"Connected this course to LeakLens by focusing on alerts that are clear, useful, and not annoying.\",\n        \"Built stronger awareness of designing security tools that normal users can actually understand.\"\n      ] },\n    { code: \"COMP 270\", name: \"Technical Writing for Engineers\", cat: \"Professional\",\n      tags: [\"Technical Writing\", \"Documentation\", \"Communication\", \"Reports\", \"Professional Writing\"],\n      bullets: [\n        \"Practiced writing clear technical explanations for engineering and computing topics.\",\n        \"Built stronger documentation skills for explaining project design, security findings, and technical decisions.\",\n        \"Connected the course to README writing, portfolio writeups, and vulnerability documentation.\"\n      ] },\n    { code: \"OB 354\", name: \"Behavior in Organizations\", cat: \"Professional\",\n      tags: [\"Organizations\", \"Leadership\", \"Teamwork\", \"Communication\", \"Workplace Behavior\"],\n      bullets: [\n        \"Studied how people behave in organizations, including teamwork, leadership, communication, and decision-making.\",\n        \"Built stronger understanding of how technical work fits inside real teams and businesses.\",\n        \"Connected the course to project leadership, security communication, and working across different roles.\"\n      ] },\n    { code: \"ENT 400\", name: \"Entrepreneurial Thinking & Behavior\", cat: \"Professional\",\n      tags: [\"Entrepreneurship\", \"Product Thinking\", \"Business Strategy\", \"Innovation\", \"Problem Solving\"],\n      bullets: [\n        \"Studied how to identify problems, evaluate ideas, and think through product or business opportunities.\",\n        \"Built a stronger product mindset for turning technical projects into useful tools.\",\n        \"Connected the course to LeakLens by thinking about user value, future premium features, and real-world adoption.\"\n      ] }\n  ];\n\n  readTheme() {\n    try {\n      const s = localStorage.getItem(\"mr-portfolio-theme\");\n      if (s === \"light\" || s === \"dark\") return s;\n    } catch (e) {}\n    return this.props.defaultTheme === \"dark\" ? \"dark\" : \"light\";\n  }\n\n  applyTheme(theme) {\n    const root = this.rootRef.current;\n    const vars = this.themes[theme] || this.themes.light;\n    if (root) {\n      Object.keys(vars).forEach((k) => root.style.setProperty(k, vars[k]));\n    }\n    // Drive the page surface from <body> (not React-managed, so setState\n    // re-renders won't reset it); descendants still read the custom props.\n    try {\n      document.body.style.background = vars[\"--bg\"];\n      document.body.style.color = vars[\"--text\"];\n    } catch (e) {}\n  }\n\n  toggleTheme = () => {\n    const next = this.state.theme === \"dark\" ? \"light\" : \"dark\";\n    this.applyTheme(next);\n    try { localStorage.setItem(\"mr-portfolio-theme\", next); } catch (e) {}\n    this.setState({ theme: next });\n  };\n\n  componentDidMount() {\n    const theme = this.readTheme();\n    this.applyTheme(theme);\n    if (theme !== this.state.theme) this.setState({ theme });\n\n    // Smooth scroll-reveal: content flows up as it enters the viewport.\n    requestAnimationFrame(() => {\n      const root = this.rootRef.current;\n      if (!root) return;\n      const items = Array.prototype.slice.call(root.querySelectorAll(\"[data-reveal]\"));\n      if (!(\"IntersectionObserver\" in window)) {\n        items.forEach((el) => { el.style.opacity = \"1\"; el.style.transform = \"none\"; });\n        return;\n      }\n      items.forEach((el) => {\n        const sibs = Array.prototype.slice.call(el.parentNode.children)\n          .filter((c) => c.hasAttribute && c.hasAttribute(\"data-reveal\"));\n        el.__d = Math.min(sibs.indexOf(el), 5) * 0.09;\n      });\n      const io = new IntersectionObserver((entries, obs) => {\n        entries.forEach((e) => {\n          if (e.isIntersecting) {\n            const el = e.target;\n            el.style.transitionDelay = (el.__d || 0) + \"s\";\n            el.style.opacity = \"1\";\n            el.style.transform = \"none\";\n            obs.unobserve(el);\n          }\n        });\n      }, { threshold: 0.12, rootMargin: \"0px 0px -6% 0px\" });\n      items.forEach((el) => io.observe(el));\n      this._io = io;\n    });\n\n    // Subtle parallax: star layer drifts slower than foreground content.\n    this._onScroll = () => {\n      if (this.starRef.current) {\n        this.starRef.current.style.transform = \"translateY(\" + (window.scrollY * 0.15) + \"px)\";\n      }\n    };\n    window.addEventListener(\"scroll\", this._onScroll, { passive: true });\n\n    // Denser star clusters around the section-break dividers.\n    requestAnimationFrame(() => {\n      const root = this.rootRef.current;\n      if (!root) return;\n      const h = root.offsetHeight || 1;\n      const extra = [];\n      [\"#projects\", \"#skills\"].forEach((sel) => {\n        const el = root.querySelector(sel);\n        if (!el) return;\n        const pct = (el.offsetTop / h) * 100;\n        for (let i = 0; i < 16; i++) {\n          extra.push({\n            top: pct + (Math.random() - 0.5) * 5,\n            left: Math.random() * 100,\n            size: Math.random() < 0.85 ? 1.5 : 2,\n            dur: 3.5 + Math.random() * 4,\n            delay: Math.random() * 6,\n            max: 0.3 + Math.random() * 0.25,\n            violet: Math.random() < 0.45\n          });\n        }\n      });\n      if (extra.length) this.setState((s) => ({ stars: s.stars.concat(extra) }));\n    });\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"scroll\", this._onScroll);\n    if (this._io) this._io.disconnect();\n  }\n\n  renderVals() {\n    const dark = this.state.theme === \"dark\";\n    const b = (s) => '<strong style=\"font-weight:600;color:var(--text)\">' + s + '<\u002Fstrong>';\n    const H = (s) => ({ __html: s });\n    const starColor = (v) =>\n      v ? (dark ? \"#c3b4ff\" : \"#8b6fe0\") : (dark ? \"#dfe4ff\" : \"#aab0c0\");\n\n    const moon = React.createElement(\n      \"svg\",\n      { width: 17, height: 17, viewBox: \"0 0 24 24\", fill: \"currentColor\" },\n      React.createElement(\"path\", { d: \"M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z\" })\n    );\n    const rays = [\n      [12, 1.5, 12, 4.5], [12, 19.5, 12, 22.5], [1.5, 12, 4.5, 12], [19.5, 12, 22.5, 12],\n      [4.6, 4.6, 6.7, 6.7], [17.3, 17.3, 19.4, 19.4], [4.6, 19.4, 6.7, 17.3], [17.3, 6.7, 19.4, 4.6]\n    ];\n    const sun = React.createElement(\n      \"svg\",\n      { width: 17, height: 17, viewBox: \"0 0 24 24\", fill: \"none\", stroke: \"currentColor\", strokeWidth: 2, strokeLinecap: \"round\" },\n      React.createElement(\"circle\", { key: \"c\", cx: 12, cy: 12, r: 4, fill: \"currentColor\", stroke: \"none\" }),\n      rays.map((r, i) =>\n        React.createElement(\"line\", { key: i, x1: r[0], y1: r[1], x2: r[2], y2: r[3] })\n      )\n    );\n\n    return {\n      bgTexture: this.props.bgTexture ?? true,\n      rootRef: this.rootRef,\n      toggleTheme: this.toggleTheme,\n      themeIcon: dark ? sun : moon,\n      starField: React.createElement(\n        \"div\",\n        { ref: this.starRef, style: { position: \"absolute\", inset: 0, pointerEvents: \"none\", zIndex: 0, willChange: \"transform\" } },\n        this.state.stars.map((s, i) =>\n          React.createElement(\"span\", {\n            key: i,\n            style: {\n              position: \"absolute\",\n              top: s.top + \"%\",\n              left: s.left + \"%\",\n              width: s.size + \"px\",\n              height: s.size + \"px\",\n              borderRadius: \"50%\",\n              background: starColor(s.violet),\n              opacity: 0.05,\n              animation: \"twk \" + s.dur + \"s ease-in-out \" + s.delay + \"s infinite\",\n              \"--mx\": s.max\n            }\n          })\n        )\n      ),\n      projects: [\n        {\n          n: \"01\",\n          title: \"MITM SSL Vulnerability Lab\",\n          status: \"Completed\",\n          points: [\n            H(`Built a ${b('man in the middle attack lab')} to study how ${b('HTTPS trust')} actually breaks down, on a ${b('Lubuntu VM')} in ${b('Oracle VirtualBox')}`),\n            H(`Routed a mobile device's traffic through ${b('mitmproxy')} over a shared network and intercepted encrypted HTTPS by installing a ${b('malicious CA certificate')} on the client`),\n            H(`Captured and analyzed full ${b('request and response data')}, including ${b('API calls and headers')} from mobile apps`),\n            H(`Confirmed that ${b('certificate pinning')} is the one defense that stops interception cold, apps using it ${b('rejected the connection outright')}`),\n            H(`Documented the gap between ${b('encryption in theory and in practice')}: the padlock icon means nothing if ${b('certificate trust is compromised')}`)\n          ],\n          tags: [\"VirtualBox\", \"Lubuntu\", \"mitmproxy\", \"SSL/TLS\", \"certificate pinning\"],\n          link
