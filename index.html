  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 background 0.16s; white-space: nowrap; flex-shrink: 0; }\n  .sk-chip:hover { border-color: var(--accent, #6b4bd6); color: var(--accent, #6b4bd6); }\n  .sk-chip[data-sel=\"1\"], .sk-chip[data-sel=\"1\"]:hover { background: var(--btn-bg, #6b4bd6); border-color: var(--btn-bg, #6b4bd6); color: var(--btn-text, #ffffff); }\n  .sk-count { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; line-height: 1; padding: 3px 6px; border-radius: 100px; background: var(--surface-2, rgba(20,22,31,0.04)); color: var(--text-faint, #7d828d); }\n  .sk-chip[data-sel=\"1\"] .sk-count { background: rgba(255,255,255,0.18); color: inherit; }\n  .crs-row { background: var(--surface, #ffffff); border: 1px solid var(--border, rgba(20,22,31,0.1)); border-radius: 14px; transition: border-color 0.18s, box-shadow 0.18s; }\n  .crs-row:hover { border-color: var(--card-hover-border, rgba(107,75,214,0.5)); }\n  .crs-row[data-open=\"1\"] { border-color: var(--card-hover-border, rgba(107,75,214,0.5)); box-shadow: var(--cert-hover-shadow, 0 12px 30px rgba(107,75,214,0.12)); }\n  .crs-head { cursor: pointer; width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 22px; background: none; border: none; text-align: left; font-family: 'Space Grotesk', system-ui, sans-serif; }\n  .crs-chev { display: inline-flex; transition: transform 0.2s ease; }\n  .crs-row[data-open=\"1\"] .crs-chev { transform: rotate(180deg); }\n  .use-link { cursor: pointer; background: none; border: none; padding: 0; font: inherit; text-decoration: none; }\n  .use-link:hover { text-decoration: underline; }\n  @keyframes flashPulse { 0% { box-shadow: 0 0 0 0 rgba(107,75,214,0.4); } 70% { box-shadow: 0 0 0 12px rgba(107,75,214,0); } 100% { box-shadow: 0 0 0 0 rgba(107,75,214,0); } }\n  .flash-highlight { animation: flashPulse 1.1s ease-out; }\n  @media (max-width: 560px) { .crs-cat { display: none !important; } }\n  @media (max-width: 900px) { .nav-sec { display: none !important; } }\n  @media (max-width: 540px) { .nav-resume-text { display: none !important; } }\n\n  /* Header section navigation */\n  .nav-links { display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 100px; background: var(--surface-2, rgba(20,22,31,0.04)); border: 1px solid var(--border-soft, rgba(20,22,31,0.07)); }\n  .nav-link { padding: 7px 15px; border-radius: 100px; font-size: 13.5px; font-weight: 500; letter-spacing: 0.005em; color: var(--text-muted, #6b717c); text-decoration: none; white-space: nowrap; transition: color 0.16s, background 0.16s, box-shadow 0.16s; }\n  .nav-link:hover { color: var(--text, #14161f); background: var(--surface, #ffffff); }\n  .nav-link[data-active=\"1\"], .nav-link[data-active=\"1\"]:hover { background: var(--btn-bg, #6b4bd6); color: var(--btn-text, #ffffff); box-shadow: 0 4px 14px rgba(107,75,214,0.25); }\n  @media (max-width: 900px) { .nav-links { order: 3; width: 100%; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; border-radius: 14px; } .nav-inner { padding-bottom: 8px !important; } }\n\n  /* Segmented tabs (skill categories, course filters) */\n  .seg-wrap { display: flex; justify-content: center; }\n  .seg { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 5px; border-radius: 100px; background: var(--surface-2, rgba(20,22,31,0.04)); border: 1px solid var(--border, rgba(20,22,31,0.1)); }\n  .seg-tab { cursor: pointer; padding: 9px 18px; border-radius: 100px; border: none; background: transparent; color: var(--text-muted, #6b717c); font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 13.5px; font-weight: 600; letter-spacing: -0.005em; white-space: nowrap; transition: color 0.16s, background 0.16s, box-shadow 0.16s; }\n  .seg-tab:hover { color: var(--text, #14161f); }\n  .seg-tab[data-sel=\"1\"], .seg-tab[data-sel=\"1\"]:hover { background: var(--surface, #ffffff); color: var(--accent, #6b4bd6); box-shadow: 0 2px 10px rgba(20,22,40,0.12); }\n  .sk-panel { background: linear-gradient(180deg, rgba(107,75,214,0.05), var(--surface, #ffffff) 140px); border: 1px solid var(--border, rgba(20,22,31,0.1)); border-radius: 22px; padding: 26px 28px 28px; }\n  .sk-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding-top: 22px; margin-top: 22px; border-top: 1px solid var(--border-soft, rgba(20,22,31,0.07)); }\n  .crs-panel { background: linear-gradient(180deg, rgba(107,75,214,0.06), rgba(107,75,214,0.015) 200px); border: 1px solid var(--border, rgba(20,22,31,0.1)); border-radius: 22px; padding: 26px 26px 28px; }\n  /* The reserve sits behind the panel, not inside it: the panel hugs its rows\n     while the section keeps a stable height so filtering cannot move the page. */\n  .crs-hold { min-height: min(62vh, 600px); }\n  .crs-list { display: flex; flex-direction: column; gap: 10px; padding-top: 22px; margin-top: 22px; border-top: 1px solid var(--border-soft, rgba(20,22,31,0.07)); }\n  @media (max-width: 560px) { .crs-panel { padding: 18px 14px 20px; } }\n  @media (max-width: 560px) { .seg { border-radius: 18px; } }\n\n  /* Project cards: --pc / --pc-rgb carry the category accent */\n  .proj-card { --pc: var(--accent, #6b4bd6); --pc-rgb: 107,75,214; position: relative; overflow: hidden; scroll-margin-top: 100px; background: linear-gradient(135deg, rgba(var(--pc-rgb), 0.08) 0%, var(--surface, #ffffff) 46%); border: 1px solid var(--border, rgba(20,22,31,0.1)); border-left: 3px solid var(--pc); border-radius: 14px; padding: 32px; transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s; }\n  .proj-card:hover { border-color: rgba(var(--pc-rgb), 0.55); border-left-color: var(--pc); box-shadow: 0 0 0 1px rgba(var(--pc-rgb), 0.18), 0 16px 40px rgba(var(--pc-rgb), 0.16); transform: translateY(-3px); }\n  .proj-card::before, .proj-card::after { content: \"\"; position: absolute; pointer-events: none; }\n  /* Network security: node mesh in the corner */\n  .cat-net::before { bottom: 0; right: 0; width: 170px; height: 110px; background-image: radial-gradient(circle, rgba(var(--pc-rgb), 0.6) 1.3px, transparent 1.7px); background-size: 16px 16px; -webkit-mask-image: radial-gradient(ellipse at bottom right, #000 15%, transparent 72%); mask-image: radial-gradient(ellipse at bottom right, #000 15%, transparent 72%); }\n  .cat-net::after { display: none; }\n  /* Browser security: window chrome strip with traffic lights */\n  .cat-browser::before { top: 0; left: 0; right: 0; height: 10px; background: rgba(var(--pc-rgb), 0.16); border-bottom: 1px solid rgba(var(--pc-rgb), 0.28); }\n  .cat-browser::after { top: 3px; left: 14px; width: 30px; height: 4px; background: radial-gradient(circle, var(--pc) 1.6px, transparent 1.9px) 0 0 / 10px 4px repeat-x; opacity: 0.85; }\n  /* Computer vision: viewfinder brackets */\n  .cat-cv::before { top: 12px; left: 12px; width: 22px; height: 22px; border-top: 2px solid var(--pc); border-left: 2px solid var(--pc); border-top-left-radius: 5px; opacity: 0.8; }\n  .cat-cv::after { bottom: 12px; right: 12px; width: 22px; height: 22px; border-bottom: 2px solid var(--pc); border-right: 2px solid var(--pc); border-bottom-right-radius: 5px; opacity: 0.8; }\n  /* Mobile / app: device frame, rounder corners and a top notch */\n  .cat-mobile { border-radius: 22px; }\n  .cat-mobile::before { top: 0; left: 50%; transform: translateX(-50%); width: 72px; height: 7px; border-radius: 0 0 7px 7px; background: rgba(var(--pc-rgb), 0.6); }\n  .cat-mobile::after { display: none; }\n  /* Web: diagonal hatch in the bottom-right corner */\n  .cat-web::before { right: 0; bottom: 0; width: 160px; height: 100px; background: repeating-linear-gradient(135deg, rgba(var(--pc-rgb), 0.22) 0 2px, transparent 2px 10px); -webkit-mask-image: radial-gradient(ellipse at bottom right, #000 10%, transparent 70%); mask-image: radial-gradient(ellipse at bottom right, #000 10%, transparent 70%); }\n  .cat-web::after { display: none; }\n  /* AI / capstone: soft glow with a four-point star */\n  .cat-ai::before { bottom: 0; right: 0; width: 220px; height: 140px; background: radial-gradient(ellipse at bottom right, rgba(var(--pc-rgb), 0.22), transparent 65%); }\n  .cat-ai::after { bottom: 16px; right: 18px; width: 16px; height: 16px; background: var(--pc); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); opacity: 0.85; }\n  .dom-tag { display: inline-flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pc); margin-bottom: 10px; }\n  .dom-tag svg { width: 15px; height: 15px; flex: none; }\n  .proj-tag { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0; padding: 5px 11px; border-radius: 6px; background: rgba(var(--pc-rgb), 0.07); border: 1px solid rgba(var(--pc-rgb), 0.24); color: var(--text-muted, #6b717c); }\n  .proj-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--text-faint, #7d828d); white-space: nowrap; }\n  @media (max-width: 560px) { .proj-card { padding: 22px; } }\n\n  /* HR Studios feature: always on the studio's own dark brand panel, in both themes */\n  .studio { --st-a: #2E7CF6; --st-b: #45D8F5; position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 208px; gap: 34px; margin-top: 30px; padding: 40px; border-radius: 22px; color: #EDF2F8; background: radial-gradient(120% 90% at 0% 0%, rgba(46,124,246,0.28), transparent 55%), radial-gradient(90% 80% at 100% 100%, rgba(69,216,245,0.18), transparent 60%), #090D13; border: 1px solid rgba(120,190,255,0.18); box-shadow: 0 30px 80px rgba(9,13,19,0.35), inset 0 1px 0 rgba(255,255,255,0.06); }\n  .studio::before { content: \"\"; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(120,190,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(120,190,255,0.06) 1px, transparent 1px); background-size: 34px 34px; -webkit-mask-image: radial-gradien https://hr-studios.com\" target=\"_blank\" rel=\"noopener\">Visit hr-studios.com <span style=\"font-size: 15px;\">↗<\u002Fspan><\u002Fa>\n            <a class=\"studio-link\" href=\"https://hr-studios.com/#work\" target=\"_blank\" rel=\"noopener\">See every case study <span style=\"font-size: 15px;\">↗<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <aside class=\"studio-rail\" aria-label=\"HR Studios projects\">\n          <div class=\"rail-head\"><span>Our work<\u002Fspan><b>{{ studioCount }} sites<\u002Fb><\u002Fdiv>\n          <div class=\"rail-scroll\" tabindex=\"0\">\n            <sc-for list=\"{{ studioWork }}\" as=\"w\" hint-placeholder-count=\"9\">\n              <a class=\"rail-item\" href=\"{{ w.url }}\" target=\"_blank\" rel=\"noopener\" aria-label=\"{{ w.name }}, {{ w.kind }} (opens the live site)\">\n                <span class=\"rail-shot\"><img src=\"{{ w.img }}\" alt=\"{{ w.name }} website\" loading=\"lazy\"><\u002Fspan>\n                <span class=\"rail-meta\"><b>{{ w.name }}<\u002Fb><span>{{ w.kind }}<\u002Fspan><\u002Fspan>\n              <\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Faside>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PROJECTS -->\n  <section id=\"projects\" style=\"position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; padding: 32px 32px; scroll-margin-top: 88px;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px;\">\n      <span style=\"width: 3px; height: 3px; border-radius: 50%; background: var(--accent-dot, rgba(107,75,214,0.6)); flex: none;\"><\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: var(--border, rgba(20,22,31,0.1));\"><\u002Fspan>\n      <span style=\"width: 3px; height: 3px; border-radius: 50%; background: var(--accent-dot, rgba(107,75,214,0.6)); flex: none;\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"sec-head\">Projects<\u002Fh2>\n\n    <div style=\"display: -style: none; display: flex; flex-direction: column; gap: 11px; max-width: 820px;\">\n            <sc-for list=\"{{ project.points }}\" as=\"point\" hint-placeholder-count=\"4\">\n              <li style=\"display: flex; gap: 13px; font-size: 15.5px; line-height: 1.62; color: var(--text-mono, #565c67); text-wrap: pretty;\">\n                <span style=\"flex: none; margin-top: 8px; width: 6px; height: 6px; border-radius: 1.5px; background: var(--accent, #6b4bd6); transform: rotate(45deg);\"><\u002Fspan>\n                <!-- Segments sit on one line: whitespace between them would render as a space before punctuation -->\n                <span><sc-for list=\"{{ point }}\" as=\"seg\" hint-placeholder-count=\"1\"><sc-if value=\"{{ seg.bold }}\" hint-placeholder-val=\"{{ false }}\"><strong style=\"font-weight: 600; color: var(--text, #14161f);\">{{ seg.t }}<\u002Fstrong><\u002Fsc-if><sc-if value=\"{{ seg.plain }}\" hint-placeholder-val=\"{{ true }}\"><span>{{ seg.t }}<\u002Fspan><\u002Fsc-if><\u002Fsc-for><\u002Fspan>\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px;\">\n            <sc-for list=\"{{ project.tags }}\" as=\"tag\" hint-placeholder-count=\"4\">\n              <span class=\"proj-tag\">{{ tag }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 22px; margin-top: 20px;\">\n            <sc-if value=\"{{ project.link }}\" hint-placeholder-val=\"\">\n              <a class=\"proj-link\" href=\"{{ project.link }}\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--accent, #6b4bd6); text-decoration: none; letter-spacing: 0.005em;\" style-hover=\"gap: 11px;\">\n                View source <span style=\"font-size: 15px;\">↗<\u002Fspan>\n              <\u002Fa>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ project.live }}\" hint-placeholder-val=\"\">\n              <a class=\"proj-link\" href=\"{{ project.live }}\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--accent, #6b4bd6); text-decoration: none; letter-spacing: 0.005em;\" style-hover=\"gap: 11px;\">\n                Live site <span style=\"font-size: 15px;\">↗<\u002Fspan>\n              <\u002Fa>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ project.store }}\" hint-placeholder-val=\"\">\n              <a class=\"proj-link\" href=\"{{ project.store }}\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--accent, #6b4bd6); text-decoration: none; letter-spacing: 0.005em;\" style-hover=\"gap: 11px;\">\n                Chrome Web Store <span style=\"font-size: 15px;\">↗<\u002Fspan>\n              <\u002Fa>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ project.demo }}\" hint-placeholder-val=\"\">\n              <a class=\"proj-link\" href=\"{{ project.demo }}\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--accent, #6b4bd6); text-decoration: none; letter-spacing: 0.005em;\" style-hover=\"gap: 11px;\">\n                Watch demo <span style=\"font-size: 15px;\">↗<\u002Fspan>\n              <\u002Fa>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- EXPERIENCE -->\n  <section id=\"experience\" style=\"position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; padding: 32px 32px; scroll-margin-top: 88px;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px;\">\n      <span style=\"width: 3px; height: 3px; border-radius: 50%; background: var(--accent-dot, rgba(107,75,214,0.6)); flex: none;\"><\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: var(--border, rgba(20,22,31,0.1));\"><\u002Fspan>\n      <span style=\"width: 3px; height: 3px; border-radius: 50%; background: var(--accent-dot, rgba(107,75,214,0.6)); flex: none;\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"sec-head\">Experience<\u002Fh2>\n\n    <div style=\"max-width: 880px; margin-top: 34px;\">\n      <sc-for list=\"{{ experience }}\" as=\"exp\" hint-placeholder-count=\"3\">\n        <div id=\"exp-{{ exp.id }}\" data-reveal=\"1\" style=\"display: flex; gap: 26px; scroll-margin-top: 100px; opacity: 0; transform: translateY(18px); transition: opacity 0.6s cubic-bezier(0.22,1,0.36,1), transform 0.6s cubic-bezier(0.22,1,0.36,1);\">\n          <div style=\"position: relative; width: 14px; flex: none; display: flex; justify-content: center;\">\n            <sc-if value=\"{{ exp.line }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"position: absolute; top: 9px; bottom: -10px; width: 1.5px; background: var(--border, rgba(20,22,31,0.1));\"><\u002Fspan>\n            <\u002Fsc-if>\n            <span style=\"position: relative; z-index: 1; width: 13px; height: 13px; border-radius: 50%; margin-top: 4px; background: var(--bg, #f6f7fb); border: 2px solid var(--accent, #6b4bd6); box-shadow: 0 0 0 3px var(--bg, #f6f7fb);\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex: 1; min-width: 0; padding-bottom: 34px;\">\n            <h3 style=\"margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; color: var(--text, #14161f);\">{{ exp.role }}<\u002Fh3>\n            <div style=\"font-size: 15px; font-weight: 500; color: var(--accent, #6b4bd6); margin-top: 5px; letter-spacing: -0.005em;\">{{ exp.company }}<\u002Fdiv>\n            <div style=\"font-size: 13px; color: var(--text-faint, #7d828d); margin-top: 7px; letter-spacing: 0.01em;\">{{ exp.period }} · {{ exp.location }}<\u002Fdiv>\n\n            <div style=\"margin-top: 20px; background: var(--surface, #ffffff); border: 1px solid var(--border, rgba(20,22,31,0.1)); border-radius: 14px; padding: 24px 26px;\">\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px;\">\n                <sc-for list=\"{{ exp.tags }}\" as=\"tag\" hint-placeholder-count=\"3\">\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0; padding: 4px 11px; border-radius: 100px; background: var(--surface-2, rgba(20,22,31,0.03)); border: 1px solid var(--border, rgba(20,22,31,0.1)); color: var(--text-muted, #6b717c);\">{{ tag }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 13px;\">\n                <sc-for list=\"{{ exp.bullets }}\" as=\"bullet\" hint-placeholder-count=\"2\">\n                  <li style=\"display: flex; gap: 13px; font-size: 15.5px; line-height: 1.6; color: var(--text-mono, #565c67); text-wrap: pretty;\">\n                    <span style=\"flex: none; color: var(--accent, #6b4bd6); font-size: 13px; line-height: 1.75;\">▸<\u002Fspan>\n                    <span><sc-for list=\"{{ bullet }}\" as=\"seg\" hint-placeholder-count=\"1\"><sc-if value=\"{{ seg.bold }}\" hint-placeholder-val=\"{{ false }}\"><strong style=\"font-weight: 600; color: var(--text, #14161f);\">{{ seg.t }}<\u002Fstrong><\u002Fsc-if><sc-if value=\"{{ seg.plain }}\" hint-placeholder-val=\"{{ true }}\"><span>{{ seg.t }}<\u002Fspan><\u002Fsc-if><\u002Fsc-for><\u002Fspan>\n                  <\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CERTIFICATIONS -->\n  <section id=\"certifications\" style=\"position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; padding: 32px 32px; scroll-margin-top: 88px;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px;\">\n      <span style=\"width: 3px; height: 3px; border-radius: 50%; background: var(--accent-dot, rgba(107,75,214,0.6)); flex: none;\"><\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: var(--border, rgba(20,22,31,0.1));\"><\u002Fspan>\n      <span style=\"width: 3px; height: 3px; border-radius: 50%; background: var(--accent-dot, rgba(107,75,214,0.6)); flex: none;\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"sec-head\">Certifications<\u002Fh2>\n    <div class=\"cert-grid\">\n      <sc-for list=\"{{ certs }}\" as=\"cert\" hint-placeholder-count=\"4\">\n        <div id=\"cert-{{ cert.id }}\" data-reveal=\"1\" style=\"opacity: 0; transform: translateY(22px); scroll-margin-top: 100px; transition: opacity 0.65s cubic-bezier(0.22,1,0.36,1), transform 0.65s cubic-bezier(0.22,1,0.36,1);\">\n        <div class=\"cert-card\" style=\"--ic: {{ cert.color }}; --ic-rgb: {{ cert.rgb }};\">\n          <div class=\"cert-top\">\n            <span class=\"cert-badge\">{{ cert.initial }}<\u002Fspan>\n            <span class=\"cert-issuer\">{{ cert.issuer }}<\u002Fspan>\n          <\u002Fdiv>\n          <h3 class=\"cert-title\">{{ cert.title }}<\u002Fh3>\n          <div class=\"cert-foot\">\n            <sc-if value=\"{{ cert.link }}\" hint-placeholder-val=\"\">\n              <a class=\"cert-link\" href=\"{{ cert.link }}\" target=\"_blank\" rel=\"noopener\">Verify <span>↗<\u002Fspan><\u002Fa>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ cert.credId }}\" hint-placeholder-val=\"\">\n              <span class=\"cert-cred\" title=\"Credential ID {{ cert.credId }}\">ID {{ cert.credShort }}<\u002Fspan>\n            <\u002Fsc-if>\n            <span class=\"cert-date\">{{ cert.date }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SKILLS -->\n  <section id=\"skills\" style=\"position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; padding: 32px 32px; scroll-margin-top: 88px;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px;\">\n      <span style=\"width: 3px; height: 3px; border-radius: 50%; background: var(--accent-dot, rgba(107,75,214,0.6)); flex: none;\"><\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: var(--border, rgba(20,22,31,0.1));\"><\u002Fspan>\n      <span style=\"width: 3px; height: 3px; border-radius: 50%; background: var(--accent-dot, rgba(107,75,214,0.6)); flex: none;\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"sec-head\">Skill Stack<\u002Fh2>\n    <p style=\"margin: 0 0 32px; font-size: 15.5px; font-weight: 400; color: var(--text-muted, #6b717c); letter-spacing: -0.005em;\">Each skill traces back to a real project, lab, or course — not just a list<\u002Fp>\n    <div class=\"sk-panel\" data-reveal=\"1\" style=\"opacity: 0; transform: translateY(20px); transition: opacity 0.65s cubic-bezier(0.22,1,0.36,1), transform 0.65s cubic-bezier(0.22,1,0.36,1);\">\n      <div class=\"seg-wrap\">\n        <div class=\"seg\" role=\"tablist\">\n          <sc-for list=\"{{ skillCatTabs }}\" as=\"tab\" hint-placeholder-count=\"4\">\n            <button class=\"seg-tab\" role=\"tab\" data-sel=\"{{ tab.sel }}\" sc-camel-on-click=\"{{ tab.select }}\">{{ tab.name }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"sk-chips\">\n        <sc-for list=\"{{ activeChips }}\" as=\"chip\" hint-placeholder-count=\"10\">\n          <button class=\"sk-chip\" data-sel=\"{{ chip.sel }}\" data-reveal=\"1\" sc-camel-on-click=\"{{ chip.select }}\" style=\"opacity: 0; transform: translateY(10px); transition: opacity 0.45s cubic-bezier(0.22,1,0.36,1), transform 0.45s cubic-bezier(0.22,1,0.36,1), border-color 0.16s, color 0.16s, background 0.16s;\">{{ chip.name }}<span class=\"sk-count\">{{ chip.count }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top: 22px; background: var(--surface-2, rgba(20,22,31,0.025)); border: 1px solid var(--accent-soft, rgba(107,75,214,0.3)); border-radius: 12px; padding: 24px 26px;\">\n        <div style=\"display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 16px;\">\n          <h3 style=\"margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.02em; color: var(--text, #14161f);\">{{ selSkillName }}<\u002Fh3>\n          <span style=\"font-size: 13px; font-weight: 500; color: var(--accent, #6b4bd6);\">Used in {{ selSkillCount }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <sc-for list=\"{{ selSkillUses }}\" as=\"use\" hint-placeholder-count=\"2\">\n            <div style=\"display: flex; gap: 13px; font-size: 15px; line-height: 1.6; color: var(--text-mono, #565c67); text-wrap: pretty;\">\n              <span style=\"flex: none; margin-top: 8px; width: 6px; height: 6px; border-radius: 1.5px; background: var(--accent, #6b4bd6); transform: rotate(45deg);\"><\u002Fspan>\n              <span>\n                <sc-if value=\"{{ use.linkable }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button class=\"use-link\" sc-camel-on-click=\"{{ use.go }}\" style=\"font-weight: 600; color: var(--accent, #6b4bd6);\">{{ use.place }}<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ use.plain }}\" hint-placeholder-val=\"{{ true }}\">\n                  <strong style=\"font-weight: 600; color: var(--accent, #6b4bd6);\">{{ use.place }}<\u002Fstrong>\n                <\u002Fsc-if>\n                 — {{ use.desc }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- COURSEWORK -->\n  <section id=\"coursework\" style=\"position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; padding: 32px 32px; scroll-margin-top: 88px;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 22px;\">\n      <span style=\"width: 3px; height: 3px; border-radius: 50%; background: var(--accent-dot, rgba(107,75,214,0.6)); flex: none;\"><\u002Fspan>\n      <span style=\"flex: 1; height: 1px; background: var(--border, rgba(20,22,31,0.1));\"><\u002Fspan>\n      <span style=\"width: 3px; height: 3px; border-radius: 50%; background: var(--accent-dot, rgba(107,75,214,0.6)); flex: none;\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"sec-head\">Academic Coursework<\u002Fh2>\n    <p style=\"margin: 0 0 32px; font-size: 15.5px; font-weight: 400; color: var(--text-muted, #6b717c); letter-spacing: -0.005em;\">Filter by area, then open any course to see what it actually covered<\u002Fp>\n    <div class=\"crs-hold\">\n    <div class=\"crs-panel\">\n      <div class=\"seg-wrap\">\n        <div class=\"seg\" role=\"tablist\">\n          <sc-for list=\"{{ courseFilters }}\" as=\"filt\" hint-placeholder-count=\"7\">\n            <button class=\"seg-tab\" role=\"tab\" data-sel=\"{{ filt.sel }}\" sc-camel-on-click=\"{{ filt.select }}\">{{ filt.name }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"crs-list\">\n        <sc-for list=\"{{ courses }}\" as=\"course\" hint-placeholder-count=\"8\">\n          <div id=\"course-{{ course.anchorId }}\" class=\"crs-row\" data-open=\"{{ course.sel }}\" data-reveal=\"1\" style=\"scroll-margin-top: 100px; opacity: 0; transform: translateY(14px); transition: opacity 0.5s cubic-bezier(0.22,1,0.36,1), transform 0.5s cubic-bezier(0.22,1,0.36,1), border-color 0.18s, box-shadow 0.18s;\">\n            <button class=\"crs-head\" sc-camel-on-click=\"{{ course.toggle }}\">\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; letter-spacing: 0; color: var(--accent, #6b4bd6); flex: none; min-width: 88px;\">{{ course.code }}<\u002Fspan>\n              <span style=\"flex: 1; min-width: 0; font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; color: var(--text, #14161f);\">{{ course.name }}<\u002Fspan>\n              <span class=\"crs-cat\" style=\"flex: none; font-size: 11px; font-weight: 500; letter-spacing: 0.03em; padding: 4px 10px; border-radius: 100px; background: var(--surface-2, rgba(20,22,31,0.03)); border: 1px solid var(--border, rgba(20,22,31,0.1)); color: var(--text-muted, #6b717c);\">{{ course.cat }}<\u002Fspan>\n              <span class=\"crs-chev\" style=\"flex: none; color: var(--text-faint, #7d828d);\">\n                <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ course.isOpen }}\" hint-placeholder-val=\"\">\n              <div style=\"padding: 2px 22px 22px;\">\n                <div style=\"display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px;\">\n                  <sc-for list=\"{{ course.tags }}\" as=\"tag\" hint-placeholder-count=\"4\">\n                    <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; padding: 4px 10px; border-radius: 6px; background: var(--surface-2, rgba(20,22,31,0.03)); border: 1px solid var(--border, rgba(20,22,31,0.1)); color: var(--text-muted, #6b717c);\">{{ tag }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px;\">\n                  <sc-for list=\"{{ course.bullets }}\" as=\"bl\" hint-placeholder-count=\"3\">\n                    <li style=\"display: flex; gap: 13px; font-size: 14.5px; line-height: 1.6; color: var(--text-mono, #565c67); text-wrap: pretty;\">\n
