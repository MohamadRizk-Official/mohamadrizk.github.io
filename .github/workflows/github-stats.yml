name: Update GitHub stats

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build assets/github-stats.json
        env:
          # A read-only token in the GH_STATS_TOKEN secret adds private repo activity (counts only, never names).
          # Without it, public activity updates and private counts carry over from the last run.
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/github_stats.py
      - name: Commit if changed
        run: |
          git diff --quiet -- assets/github-stats.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.json
          git commit -m "Update GitHub stats"
          git push
